services:
  nerd-backup:
    image: ghcr.io/avranju/nerd-backup:latest
    volumes:
      - ./config.toml:/etc/nerd-backup/config.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      # AIO lock creation/removal requires write access to this volume.
      # Adjust both paths to match the mountpoint returned by Docker inspect.
      - /var/lib/docker/volumes/nextcloud_aio_backupdir/_data:/var/lib/docker/volumes/nextcloud_aio_backupdir/_data:rw
      - /run/nerd-watch/maintenance:/run/nerd-watch/maintenance
      - nerd-backup-data:/var/lib/nerd-backup
    restart: unless-stopped
    # Allow time for stopped ordinary consumers to restart during shutdown.
    stop_grace_period: 40m

volumes:
  nerd-backup-data:
